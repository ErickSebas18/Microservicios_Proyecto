http:
  routers:
    router-app-usuarios:
      entryPoints:
        - http
      service: service-app-usuarios
      rule: "PathPrefix(`/usuarios`)"
    router-app-proyectos:
      entryPoints:
        - http
      service: service-app-proyectos
      rule: "PathPrefix(`/proyectos`)"
    router-app-documentos:
      entryPoints:
        - http
      service: service-app-documentos
      rule: "PathPrefix(`/documentos`)"
    router-app-correo:
      entryPoints:
        - http
      service: service-app-correo
      rule: "PathPrefix(`/email`)"
    router-app-agenda:
      entryPoints:
        - http
      service: service-app-agenda
      rule: "PathPrefix(`/eventos`)"
    router-app-tareas:
      entryPoints:
        - http
      service: service-app-tareas
      rule: "PathPrefix(`/tareas`)"
    router-app-comentarios:
      entryPoints:
        - http
      service: service-app-comentarios
      rule: "PathPrefix(`/comentarios`)"

  services:
    service-app-usuarios:
      loadBalancer:
        servers:
          - url: 'http://localhost:9090'
    service-app-proyectos:
      loadBalancer:
        servers:
          - url: 'http://localhost:9091'
    service-app-documentos:
      loadBalancer:
        servers:
          - url: 'http://localhost:9092'
    service-app-correo:
      loadBalancer:
        servers:
          - url: 'http://localhost:9094'
    service-app-agenda:
      loadBalancer:
        servers:
          - url: 'http://localhost:9093'
    service-app-tareas:
      loadBalancer:
        servers:
          - url: 'http://localhost:9091'
    service-app-comentarios:
      loadBalancer:
        servers:
          - url: 'http://localhost:9092'
